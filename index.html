<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>howar31</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .card {
      text-align: center;
      padding: 3rem 4rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 0.5rem;
    }
    h1 span { color: #58a6ff; }
    p {
      color: #8b949e;
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    .links a {
      display: inline-block;
      margin: 0 0.5rem;
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.9rem;
      border: 1px solid #30363d;
      padding: 0.4rem 1rem;
      border-radius: 6px;
      transition: border-color 0.2s, color 0.2s;
    }
    .links a:hover { border-color: #58a6ff; color: #79c0ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1><span>@</span>howar31</h1>
    <p>Software Engineer</p>
    <div class="links">
      <a href="https://github.com/howar31" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</body>
</html>
